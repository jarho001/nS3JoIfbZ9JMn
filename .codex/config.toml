model = "gpt-6.1-sol"
model_reasoning_effort = "medium"

[agents]
enabled = true
max_concurrent_threads_per_session = 3

[agents.implementer]
description = "Luna implementer, available only when the user explicitly requests it."
config_file = "agents/implementer.toml"

[agents.janitor]
description = "Explicitly requested cleanup of redundant development artifacts, code, tests, and documentation."
config_file = "agents/janitor.toml"

[mcp_servers.trail]
command = "node"
args = ["scripts/trail.cjs", "mcp"]
startup_timeout_sec = 120
tool_timeout_sec = 120
